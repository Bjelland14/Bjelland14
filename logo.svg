<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" role="img" aria-label="Lloyd's logo: a hand-drawn letter B written as a code tag">
  <style>
    path {
      fill: none;
      stroke-linecap: round;
      stroke-width: 9;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 0.8s ease forwards;
    }
    .bracket, .slash { stroke: #d7263d; }
    .letter { stroke: #1b2340; }
    .shade { stroke: #1f5fd1; stroke-width: 5; opacity: 0.45; }

    .letter { animation-delay: 0.6s; }
    .shade  { animation-delay: 1.4s; }
    .slash  { animation-delay: 1.8s; }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background card, so the logo is visible in both light and dark mode -->
  <rect x="4" y="4" width="332" height="192" rx="24" fill="#eaf3f7" stroke="#1b2340" stroke-width="4"/>

  <g transform="translate(10 10)">
    <path class="bracket" pathLength="1" d="M58 40 C46 54 34 68 18 86 C32 102 44 116 60 134"/>
    <g transform="translate(86 24)">
      <path class="letter" pathLength="1" d="M14 6 C13 46 15 92 14 132"/>
      <path class="letter" pathLength="1" d="M14 8 C54 2 70 22 58 46 C52 58 34 62 16 62"/>
      <path class="letter" pathLength="1" d="M16 62 C64 58 82 88 64 116 C54 132 34 134 14 130"/>
      <path class="shade" pathLength="1" d="M26 22 L44 18 M26 34 L52 28 M28 80 L56 74 M28 96 L64 88 M28 112 L60 106"/>
    </g>
    <path class="slash" pathLength="1" d="M196 150 C204 112 212 76 222 34"/>
    <path class="bracket" pathLength="1" d="M248 40 C262 54 276 68 296 86 C280 102 266 116 250 134"/>
  </g>
</svg>
